<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MBTI 十六型人格测试，60 道题，7 档量表，约 10 分钟。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232E9E5B'/%3E%3C/svg%3E">
<title>MBTI 十六型人格测试</title>
<style>
  :root {
    --paper: #FAFAF7;
    --white: #FFFFFF;
    --ink: #1A2332;
    --ink-2: #4A5568;
    --ink-3: #889298;
    --line: #E2DED4;
    --line-2: #C9C4B8;
    --accent: #2E9E5B;
    --accent-2: #23855C;
    --agree: #2E9E5B;
    --disagree: #BE7A43;
    --analyst: #88619A;
    --diplomat: #33A474;
    --sentinel: #4298B4;
    --explorer: #E4AE3A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .view { display: none; }
  .view.active { display: flex; }

  .container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- Landing ---------- */
  #view-landing {
    flex-direction: column;
    justify-content: center;
    min-height: 100vh;
    padding: 96px 0 72px;
  }

  .kicker {
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .landing-title {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 18px 0 14px;
    color: var(--ink);
  }

  .landing-meta {
    font-size: 15px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }

  .landing-meta .sep { color: var(--line-2); margin: 0 10px; }

  .landing-desc {
    margin-top: 34px;
    font-size: 16px;
    color: var(--ink-2);
    max-width: 560px;
  }

  .landing-cta {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 15px 34px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover {
    background: var(--accent-2);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(46, 158, 91, 0.24);
  }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-2);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
  }
  .btn-ghost:hover { color: var(--ink); background: rgba(26, 35, 50, 0.05); }

  .landing-note {
    margin-top: 56px;
    font-size: 13px;
    color: var(--ink-3);
    border-top: 1px solid var(--line);
    padding-top: 22px;
  }

  /* ---------- Test ---------- */
  #view-test {
    flex-direction: column;
    min-height: 100vh;
  }

  .test-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 28px 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .btn-back {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn-back:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn-back:disabled { opacity: 0.35; cursor: default; }

  .test-count {
    font-size: 14px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
    flex: 1;
    text-align: center;
  }
  .test-count b { color: var(--ink-2); font-weight: 600; }

  .test-exit {
    background: transparent;
    border: none;
    color: var(--ink-3);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    width: 40px;
    text-align: right;
  }
  .test-exit:hover { color: var(--ink); }

  .progress-track {
    max-width: 720px;
    width: 100%;
    margin: 20px auto 0;
    padding: 0 28px;
  }
  .progress-bar {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s ease;
    border-radius: 2px;
  }

  .question-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 28px;
  }

  .question {
    font-size: clamp(24px, 3.6vw, 32px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.4;
    color: var(--ink);
    animation: qIn 0.32s ease;
  }

  @keyframes qIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scale {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 56px;
  }

  .scale-lbl {
    font-size: 14px;
    color: var(--ink-3);
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .dots {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dot {
    border-radius: 50%;
    border: 2px solid var(--line-2);
    background: transparent;
    cursor: pointer;
    transition: transform 0.28s cubic-bezier(0.34, 1.75, 0.64, 1), background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    flex-shrink: 0;
  }
  .dot[data-i="0"] { width: 40px; height: 40px; }
  .dot[data-i="1"] { width: 34px; height: 34px; }
  .dot[data-i="2"] { width: 28px; height: 28px; }
  .dot[data-i="3"] { width: 22px; height: 22px; }
  .dot[data-i="4"] { width: 28px; height: 28px; }
  .dot[data-i="5"] { width: 34px; height: 34px; }
  .dot[data-i="6"] { width: 40px; height: 40px; }

  .dot[data-i="0"], .dot[data-i="1"], .dot[data-i="2"] { border-color: rgba(46, 158, 91, 0.5); }
  .dot[data-i="4"], .dot[data-i="5"], .dot[data-i="6"] { border-color: rgba(190, 122, 67, 0.5); }

  .dot:hover { transform: scale(1.08); }
  .dot[data-i="0"]:hover, .dot[data-i="1"]:hover, .dot[data-i="2"]:hover { border-color: var(--agree); }
  .dot[data-i="4"]:hover, .dot[data-i="5"]:hover, .dot[data-i="6"]:hover { border-color: var(--disagree); }
  .dot[data-i="3"]:hover { border-color: var(--ink-3); }

  .dot.filled.agree { background: var(--agree); border-color: var(--agree); }
  .dot.filled.disagree { background: var(--disagree); border-color: var(--disagree); }
  .dot.filled.neutral { background: var(--ink-3); border-color: var(--ink-3); }

  .dot.selected { transform: scale(1.6); }
  .dot.selected.agree { box-shadow: 0 0 0 7px rgba(46, 158, 91, 0.2); }
  .dot.selected.disagree { box-shadow: 0 0 0 7px rgba(190, 122, 67, 0.2); }
  .dot.selected.neutral { box-shadow: 0 0 0 7px rgba(136, 146, 152, 0.2); }

  .test-foot {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0 28px 44px;
    display: flex;
    justify-content: flex-end;
  }

  .hint {
    font-size: 13px;
    color: var(--ink-3);
  }

  /* ---------- Result ---------- */
  #view-result {
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .result-top {
    padding: 72px 0 40px;
    text-align: center;
  }

  .result-kicker {
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .type-code {
    font-size: clamp(56px, 11vw, 88px);
    font-weight: 300;
    letter-spacing: 0.14em;
    line-height: 1;
    margin: 20px 0 10px;
    color: var(--ink);
  }

  .type-name {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .type-nick {
    margin-top: 10px;
    font-size: 15px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }
  .type-nick b { color: var(--ink); font-weight: 600; }

  .type-role {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-2);
    font-weight: 600;
  }
  .role-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .result-tagline {
    margin-top: 22px;
    font-size: 17px;
    color: var(--ink-2);
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  .result-body {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 0 28px;
  }

  .dims {
    border-top: 1px solid var(--line);
    padding-top: 8px;
    margin-top: 8px;
  }

  .dim {
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
  }

  .dim-head {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .dim-head .b { color: var(--ink-3); font-weight: 500; }

  .dim-track {
    position: relative;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
  }
  .dim-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .dim-marker {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    transform: translate(-50%, -50%);
    transition: left 0.6s ease;
  }
  .dim-pct {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-3);
  }
  .dim-pct b { color: var(--ink-2); font-weight: 600; }

  .result-section {
    margin-top: 44px;
  }

  .result-section h3 {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .result-section p {
    font-size: 16px;
    color: var(--ink-2);
    text-align: justify;
    text-justify: inter-ideograph;
  }

  .trait-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 32px;
  }
  .trait-col h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .trait-col ul {
    list-style: none;
  }
  .trait-col li {
    font-size: 15px;
    color: var(--ink-2);
    padding: 7px 0 7px 18px;
    position: relative;
  }
  .trait-col li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .careers {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .career {
    font-size: 14px;
    color: var(--ink-2);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 7px 18px;
  }

  .result-actions {
    margin-top: 56px;
    display: flex;
    justify-content: center;
  }

  .watermark {
    text-align: center;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: rgba(74, 85, 104, 0.6);
    margin-top: 14px;
    user-select: none;
  }

  @media (max-width: 560px) {
    .trait-list { grid-template-columns: 1fr; gap: 24px; }
    .scale { gap: 12px; }
    .dot[data-i="0"], .dot[data-i="6"] { width: 32px; height: 32px; }
    .dot[data-i="1"], .dot[data-i="5"] { width: 28px; height: 28px; }
    .dot[data-i="2"], .dot[data-i="4"] { width: 24px; height: 24px; }
    .dot[data-i="3"] { width: 19px; height: 19px; }
  }
</style>
</head>
<body>
<main>
  <!-- Landing -->
  <section id="view-landing" class="view active">
    <div class="container">
      <div class="kicker">MBTI · 荣格类型学</div>
      <h1 class="landing-title">十六型人格测试</h1>
      <div class="landing-meta">
        60 道题<span class="sep">·</span>约 10 分钟<span class="sep">·</span>7 档量表
      </div>
      <div class="watermark">by.雯</div>
      <p class="landing-desc">
        通过四个维度的偏好，了解你获取能量的方式、接收信息的习惯、做决定的依据，以及面对生活的方式，找到属于你的十六型人格。
      </p>
      <div class="landing-cta">
        <button class="btn btn-primary" id="btn-start">开始测试</button>
      </div>
      <p class="landing-note">
        本测试基于荣格与 MBTI 人格理论改编，结果仅供自我了解与娱乐参考，不构成任何心理诊断。
      </p>
    </div>
  </section>

  <!-- Test -->
  <section id="view-test" class="view">
    <header class="test-head">
      <button class="btn-back" id="btn-prev" disabled aria-label="上一题">‹</button>
      <div class="test-count">第 <b id="q-cur">1</b> / 60 题</div>
      <button class="test-exit" id="btn-exit">退出</button>
    </header>
    <div class="progress-track">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="watermark">by.雯</div>
    <div class="question-wrap">
      <h2 class="question" id="question-text"></h2>
      <div class="scale">
        <span class="scale-lbl">同意</span>
        <div class="dots" id="dots"></div>
        <span class="scale-lbl">不同意</span>
      </div>
    </div>
    <div class="test-foot">
      <span class="hint">选择最符合你的程度，选完自动进入下一题</span>
    </div>
  </section>

  <!-- Result -->
  <section id="view-result" class="view">
    <div class="result-top">
      <div class="result-kicker">你的人格类型</div>
      <div class="watermark">by.雯</div>
      <div class="type-code" id="r-code"></div>
      <div class="type-name" id="r-name"></div>
      <div class="type-nick" id="r-nick"></div>
      <div class="type-role" id="r-role"></div>
      <p class="result-tagline" id="r-tagline"></p>
    </div>
    <div class="result-body">
      <div class="dims" id="r-dims"></div>
      <div class="result-section" id="r-overview"></div>
      <div class="result-section trait-list" id="r-traits"></div>
      <div class="result-section" id="r-careers"></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="btn-retry">重新测试</button>
      </div>
    </div>
  </section>
</main>

<script>
const QUESTIONS = [
  { d: "EI", s:  1, t: "你经常主动结识新朋友，而不是等别人来接近你。" },
  { d: "SN", s: -1, t: "你经常沉浸在对未来的想象和各种可能性里。" },
  { d: "TF", s:  1, t: "做决定时，你更依赖逻辑和客观分析，而不是个人感受。" },
  { d: "JP", s:  1, t: "你习惯提前把一切安排妥当，讨厌临时的变动。" },
  { d: "EI", s: -1, t: "独处能让你恢复精力，长时间社交会让你感到疲惫。" },
  { d: "SN", s:  1, t: "比起抽象的概念，你更关注眼前具体的事实和细节。" },
  { d: "TF", s: -1, t: "你很容易感受到别人的情绪，并会跟着一起担心。" },
  { d: "JP", s: -1, t: "你更喜欢保持灵活，随时根据情况调整计划。" },
  { d: "EI", s:  1, t: "在聚会或社交场合，你会主动跟陌生人搭话。" },
  { d: "SN", s: -1, t: "你喜欢琢磨事物背后的深层含义和规律。" },
  { d: "TF", s:  1, t: "你能够就事论事地指出问题，哪怕会让人不太舒服。" },
  { d: "JP", s:  1, t: "你喜欢把事情尽早完成，而不是拖到最后一刻。" },
  { d: "EI", s: -1, t: "比起参加热闹的聚会，你更愿意一个人安静地待着。" },
  { d: "SN", s:  1, t: "你做事喜欢按部就班、遵循明确的步骤。" },
  { d: "TF", s: -1, t: "做决定时，你会优先考虑别人的感受。" },
  { d: "JP", s: -1, t: "你常常拖到临近截止才开始动手。" },
  { d: "EI", s:  1, t: "与人相处让你充满能量，独处太久反而会烦躁。" },
  { d: "SN", s: -1, t: "比起具体细节，你更关注整体的图景和大方向。" },
  { d: "TF", s:  1, t: "你不太容易被情绪化的言论打动。" },
  { d: "JP", s:  1, t: "你的桌面、文件和时间表通常都井井有条。" },
  { d: "EI", s: -1, t: "你在发言前习惯先想清楚，而不是边说边想。" },
  { d: "SN", s:  1, t: "你更相信亲身体验和实际经验，而不是凭空想象。" },
  { d: "TF", s: -1, t: "你希望自己说的话能让人感到温暖、被理解。" },
  { d: "JP", s: -1, t: "你不喜欢被安排得明明白白，喜欢留有余地。" },
  { d: "EI", s:  1, t: "你喜欢成为人群中的焦点。" },
  { d: "SN", s: -1, t: "你常常会冒出一些看似天马行空的想法。" },
  { d: "TF", s:  1, t: "你认为做判断时，理性应该排在感情之前。" },
  { d: "JP", s:  1, t: "你会为旅行和活动提前做好详细的安排。" },
  { d: "EI", s: -1, t: "你更愿意和少数几个深交的朋友相处，而不是泛泛之交。" },
  { d: "SN", s:  1, t: "你描述事情时习惯讲具体细节，而不是只讲大概印象。" },
  { d: "TF", s: -1, t: "你更看重人际关系的和谐，而不是非要分出对错。" },
  { d: "JP", s: -1, t: "比起提前规划，你更倾向于边走边看。" },
  { d: "EI", s:  1, t: "你在集体讨论中总是抢着表达自己的看法。" },
  { d: "SN", s: -1, t: "你觉得按部就班的生活有点枯燥，渴望新的可能性。" },
  { d: "TF", s:  1, t: "你习惯指出别人逻辑上的漏洞，哪怕对方会不高兴。" },
  { d: "JP", s:  1, t: "你喜欢事情尘埃落定、有确定结论的感觉。" },
  { d: "EI", s: -1, t: "电话、视频这类需要即时回应的沟通会让你有点紧张。" },

    tagline: "天生的开心果，走到哪里就把欢乐带到哪里。",
    overview: "ESFP 热情开朗、充满活力，是天生的表演者和气氛担当。他们享受被关注、喜欢与人相处，善于用幽默和热情感染身边的人，让任何场合都热闹起来。他们活在当下，追求快乐和新鲜的体验，很少为过去后悔或为未来焦虑。这份乐观让他们广受欢迎，却也让他们容易只顾眼前的享乐，忽视长远的规划。",
    strengths: ["热情有感染力，善于社交", "乐观积极，适应力强", "懂得享受生活，有审美", "待人真诚，不做作"],
    weaknesses: ["注意力易分散，缺乏规划", "过于在意即时的快乐", "不擅长处理严肃复杂的问题", "容易回避需要坚持的事"],
    careers: ["演员", "主持人", "销售", "导游", "幼教", "餐饮管理"] }
};

const TOTAL = QUESTIONS.length;
let qIndex = 0;
let answers = new Array(TOTAL).fill(null);
let advanceTimer = null;

const $ = (id) => document.getElementById(id);
const views = {
  landing: $("view-landing"),
  test: $("view-test"),
  result: $("view-result")
};

function show(view) {
  Object.values(views).forEach((v) => v.classList.remove("active"));
  views[view].classList.add("active");
  window.scrollTo(0, 0);
}

function buildDots() {
  const wrap = $("dots");
  wrap.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const dot = document.createElement("button");
    dot.className = "dot";
    dot.setAttribute("data-i", i);
    dot.setAttribute("aria-label", "选项 " + (i + 1));
    dot.addEventListener("click", () => selectAnswer(i));
    wrap.appendChild(dot);
  }
}

function renderDots() {
  const sel = answers[qIndex];
  document.querySelectorAll("#dots .dot").forEach((dot) => {
    const i = Number(dot.getAttribute("data-i"));
    dot.classList.remove("filled", "agree", "disagree", "neutral", "selected");
    if (sel === null) return;
    let filled = false;
    let side = "";
    if (sel <= 3) {
      if (i >= sel && i <= 3) {
        filled = true;
        side = i === 3 ? "neutral" : "agree";
      }
    } else {
      if (i >= 3 && i <= sel) {
        filled = true;
        side = i === 3 ? "neutral" : "disagree";
      }
    }
    if (filled) dot.classList.add("filled", side);
    if (i === sel) dot.classList.add("selected");
  });
}

function updateProgress() {
  const answered = answers.filter((a) => a !== null).length;
  $("progress-fill").style.width = (answered / TOTAL) * 100 + "%";
  $("q-cur").textContent = qIndex + 1;
}

function renderQuestion() {
  $("question-text").textContent = QUESTIONS[qIndex].t;
  $("btn-prev").disabled = qIndex === 0;
  updateProgress();
  renderDots();
  $("question-text").style.animation = "none";
  void $("question-text").offsetWidth;
  $("question-text").style.animation = "";
}

function selectAnswer(i) {
  answers[qIndex] = i;
  renderDots();
  updateProgress();
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => next(), 450);
}

function next() {
  clearTimeout(advanceTimer);
  if (qIndex < TOTAL - 1) {
    qIndex++;
    renderQuestion();
  } else {
    finishTest();
  }
}

function prev() {
  clearTimeout(advanceTimer);
  if (qIndex > 0) {
    qIndex--;
    renderQuestion();
  }
}

function finishTest() {
  const score = { EI: 0, SN: 0, TF: 0, JP: 0 };
  for (let i = 0; i < TOTAL; i++) {
    const a = answers[i];
    if (a === null) continue;
    const q = QUESTIONS[i];
    score[q.d] += q.s * (3 - a); // a: 0..6 -> 完全同意 .. 完全不同意
  }
  const maxScore = TOTAL / 4 * 3; // 15 * 3 = 45
  const pct = {};
  const letters = [];
  DIMS.forEach((dim) => {
    const p = Math.round(50 + (score[dim.key] / maxScore) * 50);
    pct[dim.key] = Math.max(0, Math.min(100, p));
    letters.push(pct[dim.key] > 50 ? dim.al : dim.bl);
  });
  renderResult(letters.join(""), pct);
  show("result");
}

function renderResult(code, pct) {
  const t = TYPES[code];
  const roleColor = t.color;

  $("r-code").textContent = code;
  $("r-code").style.color = roleColor;
  $("r-name").textContent = t.name;
  $("r-nick").innerHTML = "别称 · <b>" + t.nick + "</b>";
  $("r-role").innerHTML =
    '<span class="role-dot" style="background:' + roleColor + '"></span>' +
    t.role + " · " + t.roleEn;
  $("r-tagline").textContent = t.tagline;

  const dimsEl = $("r-dims");
  dimsEl.innerHTML = "";
  DIMS.forEach((dim) => {
    const p = pct[dim.key];
    const q = 100 - p;
    const row = document.createElement("div");
    row.className = "dim";
    row.innerHTML =
      '<div class="dim-head"><span>' + dim.a + " " + dim.al + '</span>' +
      '<span class="b">' + dim.b + " " + dim.bl + '</span></div>' +
      '<div class="dim-track"><div class="dim-fill" style="width:' + p + '%;background:' + roleColor + '"></div>' +
      '<div class="dim-marker" style="left:' + p + '%;border-color:' + roleColor + '"></div></div>' +
      '<div class="dim-pct"><span><b>' + p + '%</b> ' + dim.a + '</span>' +
      '<span>' + dim.b + " <b>" + q + '%</b></span></div>';
    dimsEl.appendChild(row);
  });

  $("r-overview").innerHTML =
    '<h3>关于你</h3><p>' + t.overview + "</p>";

  $("r-traits").innerHTML =
    '<div class="trait-col"><h4>优点</h4><ul>' +
    t.strengths.map((s) => "<li>" + s + "</li>").join("") +
    '</ul></div><div class="trait-col"><h4>缺点</h4><ul>' +
    t.weaknesses.map((s) => "<li>" + s + "</li>").join("") +
    "</ul></div>";

  $("r-careers").innerHTML =
    '<h3>适合的职业</h3><div class="careers">' +
    t.careers.map((c) => '<span class="career">' + c + "</span>").join("") +
    "</div>";
}

function startTest() {
  qIndex = 0;
  answers = new Array(TOTAL).fill(null);
  clearTimeout(advanceTimer);
  show("test");
  renderQuestion();
}

function exitTest() {
  const answered = answers.filter((a) => a !== null).length;
  if (answered > 0 && !confirm("进度尚未完成，确定要退出吗？")) return;
  clearTimeout(advanceTimer);
  show("landing");
}

$("btn-start").addEventListener("click", startTest);
$("btn-retry").addEventListener("click", startTest);
$("btn-prev").addEventListener("click", prev);
$("btn-exit").addEventListener("click", exitTest);

buildDots();
</script>
</body>
</html>
